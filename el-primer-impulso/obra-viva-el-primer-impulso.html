<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manuel Góngora — Ecuación Creativa Infinito: The Big Bang — Obra viva</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#403347}
canvas{display:block;width:100vw;height:100vh;touch-action:none}

/* Solo pantalla inicial para conceder acceso a una carpeta. No hay botones de guardado. */
#folderStart{position:fixed;inset:0;z-index:30;background:rgba(24,20,30,.88);display:flex;align-items:center;justify-content:center;padding:24px;font-family:Arial,Helvetica,sans-serif;color:#fff;text-align:center}
#folderStart .panel{max-width:410px;padding:26px;background:rgba(45,39,56,.96);border:1px solid rgba(255,255,255,.20);border-radius:16px;box-shadow:0 14px 48px rgba(0,0,0,.25)}
#folderStart h1{font-size:19px;line-height:1.3;margin:0 0 12px;font-weight:600}
#folderStart p{font-size:14px;line-height:1.5;color:#dedbe3;margin:0 0 18px}
#chooseFolder{padding:12px 18px;background:#f3eff9;border:0;border-radius:8px;color:#27202d;font-size:15px;font-weight:600;cursor:pointer}
#folderError{font-size:13px;line-height:1.4;color:#ffd2d2;margin-top:14px;min-height:0}
#folderStart[hidden]{display:none}

/* Exhibición web únicamente: sin diálogo de carpeta. */
#folderStart{display:none!important}
</style>
</head>
<body>
<canvas id="obra" aria-label="Ecuación Creativa Infinito — The Big Bang. Obra viva que pinta continuamente." role="img"></canvas>
<div id="folderStart" role="dialog" aria-modal="true" aria-label="Elegir carpeta de imágenes">
  <div class="panel">
    <h1>Ecuación Creativa Infinito — The Big Bang</h1>
    <p>Elige una carpeta una sola vez. Después, cada obra terminada se guardará allí automáticamente como imagen PNG de alta resolución.</p>
    <button type="button" id="chooseFolder">Elegir carpeta e iniciar</button>
    <div id="folderError" aria-live="polite"></div>
  </div>
</div>
<script>
'use strict';
/*
  ECUACIÓN CREATIVA INFINITO — THE BIG BANG
  Manuel Góngora / primera prueba del lenguaje del pincel
  Proyecto NUEVO independiente de Inteligencia Artificial.

  El pincel pinta progresivamente en toda la obra: ningún elemento se estampa
  como un objeto terminado. La presión varía de punta a masa y vuelve a punta.
  Orden: fondo con brochas 150–250 px, formas con brochas medianas y gruesas,
  detalles de 1–9 px. Fondo fundido de 2 o 3 colores. Nunca negro del espacio.
  Cada pintura tarda 4–6 minutos; permanece 2 s y comienza otra.
*/
const canvas=document.getElementById('obra');
const ctx=canvas.getContext('2d',{alpha:false});
const baseLayer=document.createElement('canvas');
const baseCtx=baseLayer.getContext('2d',{alpha:false});
const TAU=2*Math.PI;
const rand=(a,b)=>a+Math.random()*(b-a);
const integer=(a,b)=>Math.floor(rand(a,b+1));
const choose=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t);
const clamp01=t=>clamp(t,0,1);
const rgb=c=>`rgb(${c.map(x=>Math.round(clamp(x,0,255))).join(',')})`;
const mix=(a,b,t)=>a.map((v,i)=>lerp(v,b[i],t));
let W=1200,H=760,D=1,workNo=0;
let startAt=0,finishAt=0,holdAt=0,phase='paint',paused=false,cycleCompleted=false,initialGlobalLiquifyDone=false;
let actions=[],actionIndex=0,completed=0;
let bg=[],accents=[],colorMood=0,bgMode='mixed',composition=null,flatBaseColor=null;
let pendingResize=0,nextLiquifyAt=0,bgEndAt=0,formsEndAt=0,detailStartAt=0,liquifyPool=[];
let bgPool=[],formPool=[],detailPool=[],liquifyEvents=[],liquifyIndex=0,detailPalette=[];

function hsl(h,s,l){
 h=((h%360)+360)%360/60;s=clamp01(s);l=clamp01(l);
 const C=(1-Math.abs(2*l-1))*s,X=C*(1-Math.abs(h%2-1)),m=l-C/2;
 const q=h<1?[C,X,0]:h<2?[X,C,0]:h<3?[0,C,X]:h<4?[0,X,C]:h<5?[X,0,C]:[C,0,X];
 return q.map(t=>(t+m)*255);
}
function pigment(h,s,l){return mix(hsl(h,s,l),hsl(h+180,s,l),.06)}
function illuminate(a,t){return mix(a,[247,237,220],clamp01(t))}
function deepen(a,t){return mix(a,[34,27,44],clamp01(t))}
function complement(a){return [255-a[0],255-a[1],255-a[2]]}
function vibrantComplement(a){
 const c=complement(a);
 return mix(c,illuminate(c,.10),.18);
}
function preparePalette(){
 const families=[
  {name:'red',h:rand(350,10)},
  {name:'violet',h:rand(262,282)},
  {name:'purple',h:rand(286,310)},
  {name:'green',h:rand(108,145)},
  {name:'blue',h:rand(198,234)},
  {name:'ochre',h:rand(36,52)},
  {name:'caramel',h:rand(18,32)},
  {name:'yellow',h:rand(52,66)}
 ];
 const picks=[];
 bgMode=choose(['light','medium','dark','mixed']);
 // Rojo siempre presente y reforzado, junto a fríos y cálidos.
 picks.push(families[0]);
 picks.push(chance(.5)?families[4]:(chance(.5)?families[1]:families[2]));
 picks.push(chance(.5)?families[5]:families[6]);
 while(picks.length<integer(5,7)){
  const cand=choose(families);
  if(!picks.includes(cand))picks.push(cand);
 }
 const toneForMode=()=>{
  if(bgMode==='light') return rand(.48,.78);
  if(bgMode==='medium') return rand(.28,.56);
  if(bgMode==='dark') return rand(.12,.34);
  return choose([rand(.14,.30),rand(.28,.50),rand(.48,.76)]);
 };
 bg=[];
 const redH=families[0].h;
 bg.push(pigment(redH+rand(-8,8),rand(.58,.92),bgMode==='light'?rand(.56,.78):bgMode==='medium'?rand(.34,.56):bgMode==='dark'?rand(.16,.32):choose([rand(.18,.32),rand(.34,.56),rand(.56,.76)])));
 bg.push(pigment(redH+rand(-10,10),rand(.50,.86),bgMode==='light'?rand(.44,.66):bgMode==='medium'?rand(.24,.46):bgMode==='dark'?rand(.12,.24):choose([rand(.16,.28),rand(.24,.46),rand(.44,.64)])));
 bg.push(pigment(redH+rand(-12,12),rand(.36,.72),rand(.12,.22)));
 for(let i=1;i<picks.length;i++){
  const fh=picks[i].h;
  bg.push(pigment(fh+rand(-14,14),rand(.40,.92),toneForMode()));
 }
 bg.push(pigment(choose(picks).h+rand(-10,10),rand(.30,.66),rand(.62,.84)));
 const darkA=mix(pigment(rand(350,15),.68,.20),pigment(rand(208,238),.62,.18),.52);
 const darkB=mix(pigment(rand(20,52),.66,.22),pigment(rand(265,305),.58,.18),.48);
 const nearBlack=mix(darkA,darkB,.50);
 bg.push(mix(nearBlack,choose(bg),.12));
 accents=[];
 for(let i=0;i<Math.max(12,picks.length*3);i++){
  const fam=i<3?families[0]:picks[i%picks.length];
  const base=choose(bg);
  const vivid=pigment(fam.h+rand(-24,24),rand(.56,.98),rand(.26,.78));
  accents.push(
    chance(.24)?vibrantComplement(base):
    chance(.28)?illuminate(vivid,rand(.12,.34)):
    chance(.18)?deepen(vivid,rand(.12,.28)):
    mix(vivid,base,rand(.04,.18))
  );
 }
 detailPalette=[];
 const dominant=[...bg.slice(0,Math.min(6,bg.length)),...accents.slice(0,Math.min(8,accents.length))];
 for(const col of dominant){
   const c=vibrantComplement(col);
   detailPalette.push(c);
   detailPalette.push(illuminate(c,rand(.08,.24)));
   detailPalette.push(mix(c,choose(accents),rand(.10,.24)));
 }
 colorMood=redH;
}
function paintPoint(x,y,t){
 const a=composition.angle,c=composition.centerX,d=composition.centerY;
 const v=composition.extent*t;
 return [c+Math.cos(a)*v+x,d+Math.sin(a)*v+y];
}
function prepareComposition(){
 composition={
  centerX:rand(W*.34,W*.67),centerY:rand(H*.33,H*.67),
  angle:rand(-1.07,.86),extent:Math.min(W,H)*rand(.34,.50),
  direction:chance(.5)?1:-1
 };
}
function backgroundBase(){
 // Al abrir: un color plano total con iluminaciones sutiles y visibles.
 const base=choose(bg.slice(0,Math.min(4,bg.length)));
 flatBaseColor=base;
 baseCtx.fillStyle=rgb(base);baseCtx.fillRect(0,0,W,H);
 initialFlatIlluminations(baseCtx,base);
}
function initialFlatIlluminations(context,base){
 // Iluminaciones iniciales mucho más grandes y brillantes, siempre orgánicas, nunca círculos ni geometría.
 const zones=integer(2,4);
 for(let i=0;i<zones;i++){
  const cx=rand(W*.10,W*.90), cy=rand(H*.10,H*.90);
  const ang=rand(-Math.PI,Math.PI);
  const len=rand(Math.min(W,H)*.55,Math.min(W,H)*1.15);
  const wid=rand(Math.min(W,H)*.25,Math.min(W,H)*.55);
  const glow=illuminate(base,rand(.40,.62));
  const mid=mix(glow,base,.28);

  // Base luminosa orgánica, irregular, como una gran mancha de luz pintada a mano.
  const pts=makePath(cx-Math.cos(ang)*len*.25,cy-Math.sin(ang)*len*.25,len,ang,rand(.10,.24),integer(18,32),chance(.45)?'fold':'flow');
  context.save();
  context.globalCompositeOperation='screen';
  context.filter=`blur(${rand(26,54).toFixed(1)}px)`;
  context.beginPath();
  const p0=pts[0];
  context.moveTo(p0[0]+rand(-wid*.45,wid*.45),p0[1]+rand(-wid*.45,wid*.45));
  for(let j=1;j<pts.length;j++){
    const p=pts[j];
    const prev=pts[j-1];
    const mx=(prev[0]+p[0])*.5 + rand(-wid*.22,wid*.22);
    const my=(prev[1]+p[1])*.5 + rand(-wid*.22,wid*.22);
    context.quadraticCurveTo(prev[0]+rand(-wid*.18,wid*.18),prev[1]+rand(-wid*.18,wid*.18),mx,my);
  }
  for(let j=pts.length-1;j>=0;j--){
    const p=pts[j];
    const offAng=ang+Math.PI/2+rand(-.85,.85);
    const d=wid*rand(.70,1.35);
    context.lineTo(p[0]+Math.cos(offAng)*d,p[1]+Math.sin(offAng)*d);
  }
  context.closePath();
  const grad=context.createLinearGradient(cx-Math.cos(ang)*len*.7,cy-Math.sin(ang)*len*.7,cx+Math.cos(ang)*len*.7,cy+Math.sin(ang)*len*.7);
  grad.addColorStop(0,rgb(base,0));
  grad.addColorStop(.14,rgb(mix(mid,glow,.42),rand(.22,.32)));
  grad.addColorStop(.50,rgb(glow,rand(.42,.62)));
  grad.addColorStop(.86,rgb(mix(mid,glow,.36),rand(.18,.28)));
  grad.addColorStop(1,rgb(base,0));
  context.fillStyle=grad;
  context.fill();
  context.restore();

  // Refuerzo con brochazos de luz más intensos, orgánicos y alargados.
  const sweeps=integer(3,5);
  for(let s=0;s<sweeps;s++){
    const a=ang+rand(-1.1,1.1);
    const l=len*rand(.45,1.05);
    const startX=cx+rand(-wid*.80,wid*.80), startY=cy+rand(-wid*.80,wid*.80);
    const sweepPts=makePath(startX,startY,l,a,rand(.10,.22),integer(14,24),chance(.5)?'fold':'flow');
    const lightCol=illuminate(glow,rand(.12,.28));
    const stroke=strokePoints(sweepPts,rand(68,160),lightCol,{alpha:rand(.16,.30),blend:mix(lightCol,base,.18),edgeSoft:1.18,kind:'background',in:.06,out:.10,wave:rand(.07,.18),flat:true,sheen:false,duration:.5});
    paintRibbon(context,stroke,sweepPts.length-1);
  }
 }

 // Barridos de luz adicionales, amplios y libres, nunca geométricos.
 const veils=integer(3,5);
 for(let i=0;i<veils;i++){
  const ang=rand(-Math.PI,Math.PI), len=rand(Math.max(W,H)*.65,Math.max(W,H)*1.20);
  const x=rand(W*.08,W*.92), y=rand(H*.08,H*.92);
  const pts=makePath(x,y,len,ang,rand(.08,.18),integer(18,30),chance(.44)?'fold':'flow');
  const c=illuminate(base,rand(.30,.50));
  const stroke=strokePoints(pts,rand(150,300),c,{alpha:rand(.10,.18),blend:mix(c,base,.24),edgeSoft:1.24,kind:'background',in:.10,out:.14,wave:rand(.05,.12),flat:true,sheen:false,duration:.5});
  paintRibbon(context,stroke,pts.length-1);
 }
}
function atmosphereVeil(context){
 // Velos grandes, claros y oscuros, para dar profundidad y misterio desde el fondo.
 for(let i=0;i<4;i++){
  const cx=rand(W*.08,W*.92),cy=rand(H*.08,H*.92),rx=rand(W*.22,W*.48),ry=rand(H*.18,H*.42);
  const dark=deepen(choose(bg),rand(.18,.34));
  const lightCol=illuminate(choose(bg),rand(.10,.22));
  const grad=context.createRadialGradient(cx-rx*.18,cy-ry*.15,Math.max(8,Math.min(rx,ry)*.10),cx,cy,Math.max(rx,ry));
  grad.addColorStop(0,rgb(lightCol,.08));
  grad.addColorStop(.52,rgb(mix(dark,lightCol,.28),.05));
  grad.addColorStop(1,rgb(dark,.00));
  context.save();
  context.fillStyle=grad;
  context.beginPath();
  context.ellipse(cx,cy,rx,ry,rand(-1.2,1.2),0,TAU);
  context.fill();
  context.restore();
 }
 // Vignette suave para misterio.
 const vg=context.createRadialGradient(W*.48,H*.44,Math.min(W,H)*.16,W*.5,H*.5,Math.max(W,H)*.78);
 vg.addColorStop(0,'rgba(255,255,255,0)');
 vg.addColorStop(.72,'rgba(22,18,26,0.00)');
 vg.addColorStop(1,'rgba(18,14,22,0.18)');
 context.save(); context.fillStyle=vg; context.fillRect(0,0,W,H); context.restore();
}
function makePath(x,y,length,angle,turn=.13,n=35,kind='flow'){
 let px=x,py=y,a=angle,phase=rand(0,TAU),pts=[[x,y]];
 const curl=kind==='fold'?rand(-.15,.15):rand(-.055,.055);
 const wave=rand(.24,1.13),sway=rand(.02,.075);
 for(let i=1;i<=n;i++){
  const t=i/n;
  a+=curl/n*2+Math.sin(t*TAU*wave+phase)*turn/n*7+rand(-sway,sway);
  const st=length/n*rand(.82,1.15);
  px+=Math.cos(a)*st;py+=Math.sin(a)*st;
  pts.push([px,py]);
 }
 return pts;
}
function strokePressure(t,form){
 const fadeIn=clamp01(t/(form.in||.10));
 const fadeOut=clamp01((1-t)/(form.out||.12));
 let env=Math.pow(Math.sin(fadeIn*Math.PI*.5)*Math.sin(fadeOut*Math.PI*.5),.70);
 const pulse=1+form.wave*Math.sin(t*TAU*form.freq+form.phase)
                +form.wave*.42*Math.sin(t*TAU*(form.freq*2.3)+form.phase*1.9);
 if(form.flat)env=.62+.38*env;
 return clamp(env*pulse,.007,1.22);
}
function strokePoints(pts,width,color,opts={}){
 return {
  pts, width,color,alpha:opts.alpha??rand(.55,.92),
  precision:opts.precision??1,
  blend:opts.blend||null,
  edgeSoft:opts.edgeSoft??(opts.kind==='background'?1:.72),
  taperMode:opts.taperMode||null,
  pressure:{in:opts.in??rand(.06,.18),out:opts.out??rand(.08,.20),
   phase:rand(0,TAU),wave:opts.wave??rand(.08,.22),freq:rand(.65,2.15),flat:!!opts.flat},
  drawn:0,
  sheen:opts.sheen??chance(.32),
  kind:opts.kind||'form',
  noAutoLiquify:!!opts.noAutoLiquify,
  t0:0,t1:0,
  duration:opts.duration||1
 };
}
function pushAction(stage,stroke){actions.push({stage,stroke})}

function buildBackground(){
 // Empieza desde un color plano iluminado y luego construye el fondo.
 // Aquí el complementario solo se mezcla suavemente, alrededor de un 3%, para no engrisar tanto el color.
 const passes=integer(14,24);
 const intro=integer(4,6);
 const baseComp=vibrantComplement(flatBaseColor||choose(bg));
 for(let i=0;i<passes;i++){
  let x=0,y=0,angle=0,length=0,width=0,steps=0,turn=0,kind='flow';
  const thickMul=rand(.5,1.5);
  if(i<intro){
   const side=integer(0,3);
   if(side===0){ x=rand(-W*.14,W*1.14); y=-H*.16; angle=rand(.35,2.80); }
   else if(side===1){ x=W*1.16; y=rand(-H*.14,H*1.14); angle=rand(1.85,4.25); }
   else if(side===2){ x=rand(-W*.14,W*1.14); y=H*1.16; angle=rand(3.45,5.95); }
   else { x=-W*.16; y=rand(-H*.14,H*1.14); angle=rand(-.95,1.05); }
   length=Math.max(W,H)*rand(.76,1.30);
   width=rand(165,265)*thickMul;
   steps=integer(30,56);
   turn=rand(.03,.11);
   kind=chance(.15)?'fold':'flow';
  }else{
   const side=integer(0,7);
   if(side===0){ x=rand(-W*.18,W*1.18); y=-H*.14; angle=rand(.15,2.95); }
   else if(side===1){ x=W*1.14; y=rand(-H*.18,H*1.18); angle=rand(1.6,4.4); }
   else if(side===2){ x=rand(-W*.18,W*1.18); y=H*1.14; angle=rand(3.3,6.0); }
   else if(side===3){ x=-W*.14; y=rand(-H*.18,H*1.18); angle=rand(-1.0,1.2); }
   else { x=rand(W*.18,W*.82); y=rand(H*.18,H*.82); angle=rand(-Math.PI,Math.PI); }
   length=Math.max(W,H)*rand(.48,1.12);
   width=rand(150,250)*thickMul;
   steps=integer(26,56);
   turn=rand(.04,.16);
   kind=chance(.22)?'fold':'flow';
  }
  const seedCol=Math.random()<.42?choose(bg.slice(0,3)):chance(.22)?choose(accents):choose(bg);
  const compWeight=.03;
  const baseCol=mix(seedCol,baseComp,compWeight);
  const blendCol=chance(.55)
    ? mix(baseCol,baseComp,rand(.03,.08))
    : mix(baseCol,choose(bg),rand(.04,.12));
  const pts=makePath(x,y,length,angle,turn,steps,kind);
  const alphaRange=bgMode==='light'?[.18,.40]:bgMode==='medium'?[.20,.48]:bgMode==='dark'?[.24,.58]:[.18,.54];
  pushAction('bg',strokePoints(pts,width,baseCol,{flat:true,alpha:rand(alphaRange[0],alphaRange[1]),blend:blendCol,edgeSoft:1.02,kind:'background',in:.04,out:.06,wave:rand(.08,.16),sheen:false,duration:rand(.42,.82)}));
 }
 // Veladuras largas con muy poca mezcla complementaria para conservar más color.
 for(let i=0;i<integer(6,12);i++){
  const x=rand(W*.08,W*.92), y=rand(H*.08,H*.92), a=rand(-Math.PI,Math.PI);
  const seedCol=Math.random()<.34?choose(bg.slice(0,3)):chance(.30)?choose(detailPalette):chance(.34)?choose(accents):choose(bg);
  const compWeight=.03;
  const col=mix(seedCol,baseComp,compWeight);
  const pts=makePath(x,y,rand(Math.min(W,H)*.44,Math.max(W,H)*.98),a,rand(.05,.18),integer(22,44),chance(.34)?'fold':'flow');
  const blendCol=mix(col,chance(.50)?choose(bg):baseComp,rand(.03,.10));
  const width=rand(138,235)*rand(.5,1.5);
  pushAction('bg',strokePoints(pts,width,col,{alpha:rand(.14,.34),blend:blendCol,edgeSoft:1.06,kind:'background',in:.06,out:.09,wave:rand(.09,.18),flat:true,sheen:false,duration:rand(.42,.84)}));
 }
}
function mainAnchor(){
 if(chance(.58)){
  const cols=[.16,.34,.52,.70,.86], rows=[.18,.36,.54,.72,.86];
  return [W*choose(cols)+rand(-W*.08,W*.08), H*choose(rows)+rand(-H*.08,H*.08)];
 }
 const t=rand(-.95,.95),dx=rand(-W*.28,W*.28),dy=rand(-H*.24,H*.24);
 return paintPoint(dx,dy,t);
}

function detailSpots(){
 const spots=[];
 const total=integer(18,30);
 for(let i=0;i<total;i++){
  if(chance(.32))spots.push(mainAnchor());
  else if(chance(.34))spots.push(paintPoint(rand(-W*.40,W*.40),rand(-H*.32,H*.32),rand(-.94,.94)));
  else spots.push([rand(W*.10,W*.90),rand(H*.10,H*.90)]);
 }
 return spots;
}
function arcPath(cx,cy,r,a0,a1,n=18){
 const pts=[];
 for(let i=0;i<=n;i++){
  const t=i/n, a=lerp(a0,a1,t)+Math.sin(t*TAU*rand(.35,1.10)+rand(0,TAU))*0.05;
  const rr=r*(1+Math.sin(t*TAU*rand(.55,1.45)+rand(0,TAU))*0.08+rand(-.06,.06));
  pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);
 }
 return pts;
}
function addSpineDetail(cx,cy,scale,color){
 const ang=rand(-Math.PI,Math.PI), len=scale*rand(1.1,2.2);
 const main=makePath(cx,cy,len,ang,rand(.10,.28),integer(12,24),chance(.46)?'fold':'flow');
 const width=rand(3.0,13.5), taper=chance(.5)?'startHeavy':'endHeavy';
 color=detailColor(color);
 pushAction('detail',strokePoints(main,width,color,{alpha:detailAlpha(),blend:mix(color,choose(accents),rand(.10,.24)),edgeSoft:rand(.18,.38),kind:'detail',duration:rand(.20,.56),sheen:false,taperMode:taper,in:rand(.04,.12),out:rand(.04,.14)}));
 const thorns=integer(1,4);
 for(let i=1;i<thorns;i++){
  const p=main[Math.min(main.length-2,Math.max(1,Math.floor(i*(main.length-1)/thorns)))];
  const side=chance(.5)?1:-1;
  const a=ang+side*(Math.PI/2)+rand(-.65,.65), tlen=scale*rand(.20,.58);

 if(s.kind!=='background'){
  context.globalAlpha=s.alpha*(s.kind==='detail'?.08:s.kind==='form'?.16:.10);
  const inner=context.createLinearGradient(p0[0]-s.width*.10,p0[1]-s.width*.10,p1[0]+s.width*.10,p1[1]+s.width*.10);
  inner.addColorStop(0,rgb(illuminate(s.color,.22),0));
  inner.addColorStop(.32,rgb(illuminate(s.color,.30),.10));
  inner.addColorStop(.62,rgb(illuminate(s.blend||s.color,.38),.18));
  inner.addColorStop(1,rgb(illuminate(s.blend||s.color,.18),0));
  path();
  context.fillStyle=inner;context.fill();
 }
 // La veta forma parte de la pintura, no añade grupos de pelos.
 if(s.sheen&&s.width>11&&count>=5){
  context.globalAlpha=s.alpha*.18;
  context.strokeStyle=rgb(illuminate(s.blend||s.color,.41));
  context.lineWidth=Math.max(.5,Math.min(2.2,s.width*.014));
  context.lineCap='butt';
  context.beginPath();
  for(let i=2;i<=count;i++){
   const a=s.pts[i-1],b=s.pts[i];
   const dx=b[0]-a[0],dy=b[1]-a[1],ll=Math.hypot(dx,dy)||1;
   const nx=-dy/ll,ny=dx/ll;
   const ww=s.width*strokePressure(i/(s.pts.length-1),s.pressure)*.23;
   const px=b[0]+nx*ww,py=b[1]+ny*ww;
   if(i===2)context.moveTo(px,py); else context.lineTo(px,py);
  }
  context.stroke();
 }
 context.restore();
}

function strokeBounds(s){
 let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
 for(let i=0;i<s.pts.length;i++){
  const p=s.pts[i];
  if(p[0]<minX)minX=p[0]; if(p[1]<minY)minY=p[1];
  if(p[0]>maxX)maxX=p[0]; if(p[1]>maxY)maxY=p[1];
 }
 const pad=Math.max(12,s.width*.90);
 return {x:clamp(minX-pad,0,W),y:clamp(minY-pad,0,H),w:clamp((maxX-minX)+pad*2,18,W),h:clamp((maxY-minY)+pad*2,18,H)};
}
function liquifyRegion(context,x,y,rw,rh,maxPct=.05){
 // Igual idea del INFINITO original: remuestreo real de la pintura dentro de la región.
 maxPct=Math.min(.13,Math.max(.004,maxPct));
 let sx=Math.max(0,Math.floor(x*D)),sy=Math.max(0,Math.floor(y*D));
 let sw=Math.min(baseLayer.width-sx,Math.floor(rw*D)),sh=Math.min(baseLayer.height-sy,Math.floor(rh*D));
 if(sw<16||sh<16)return;
 let src=context.getImageData(sx,sy,sw,sh),dst=context.createImageData(sw,sh);
 let a=src.data,b=dst.data,amp=Math.min(sw,sh)*clamp(maxPct,.004,.13)*rand(.48,.82);
 let horizontal=Math.random()<.5,sign=Math.random()<.5?-1:1;
 let cx=sw*.5,cy=sh*.5,rx=sw*.5,ry=sh*.5;
 const envX=new Float64Array(sw),envY=new Float64Array(sh);
 const waveX=horizontal?null:new Float64Array(sw);
 const waveY=horizontal?new Float64Array(sh):null;
 const rhythmWave=.86;
 for(let xx=0;xx<sw;xx++){
   let nx=(xx-cx)/rx;
   envX[xx]=Math.pow(Math.max(0,1-nx*nx),1.7);
   if(!horizontal)waveX[xx]=Math.sin(nx*Math.PI*.82*rhythmWave+.45);
 }
 for(let yy=0;yy<sh;yy++){
   let ny=(yy-cy)/ry;
   envY[yy]=Math.pow(Math.max(0,1-ny*ny),1.7);
   if(horizontal)waveY[yy]=Math.sin(ny*Math.PI*.82*rhythmWave+.45);
 }
 for(let yy=0;yy<sh;yy++)for(let xx=0;xx<sw;xx++){
   let envelope=envX[xx]*envY[yy];
   let wave=horizontal?waveY[yy]:waveX[xx];
   let delta=sign*amp*envelope*wave;
   let fx=clamp(xx-(horizontal?delta:0),0,sw-1),fy=clamp(yy-(horizontal?0:delta),0,sh-1);
   let x0=Math.floor(fx),y0=Math.floor(fy),x1=Math.min(sw-1,x0+1),y1=Math.min(sh-1,y0+1),tx=fx-x0,ty=fy-y0;
   let k00=(y0*sw+x0)*4,k10=(y0*sw+x1)*4,k01=(y1*sw+x0)*4,k11=(y1*sw+x1)*4,j=(yy*sw+xx)*4;
   for(let ch=0;ch<3;ch++){
     let v0=a[k00+ch]*(1-tx)+a[k10+ch]*tx,v1=a[k01+ch]*(1-tx)+a[k11+ch]*tx;
     b[j+ch]=v0*(1-ty)+v1*ty;
   }
   b[j+3]=255;
 }
 context.putImageData(dst,sx,sy);
}
function maybeLiquifyStroke(context,s,count){ return; }
function expandRegionAroundStroke(s,minPct,maxPct){
 const area=W*H, target=area*rand(minPct,maxPct), aspect=rand(.75,1.38);
 let rw=Math.sqrt(target*aspect), rh=target/Math.max(rw,1);
 const r=strokeBounds(s), cx=r.x+r.w*.5+rand(-r.w*.18,r.w*.18), cy=r.y+r.h*.5+rand(-r.h*.18,r.h*.18);
 rw=Math.max(rw,r.w*1.2); rh=Math.max(rh,r.h*1.2);
 return {x:clamp(cx-rw*.5,0,Math.max(0,W-rw)), y:clamp(cy-rh*.5,0,Math.max(0,H-rh)), w:Math.min(rw,W), h:Math.min(rh,H)};
}
function prepareLiquifyPlan(){
 liquifyEvents=[];liquifyIndex=0;
 if(bgEndAt>startAt){
  const bgDur=bgEndAt-startAt;
  // Después del primer gran liquify global, los demás serán medianos y suaves.
  const bgCount=integer(4,8);
  for(let i=0;i<bgCount;i++){
   liquifyEvents.push({time:startAt+bgDur*((i+1)/(bgCount+1)), phase:'bg'});
  }
 }
 // En esta versión solo fondo, el liquify inicial global y el final se aplican desde frame().
 liquifyEvents.sort((a,b)=>a.time-b.time);
}
function applyLiquifyEvent(phase){
 if(phase==='global_start'){
   // Liquify fuerte sobre toda el área del lienzo justo al aparecer la primera imagen pintada.
   const reps=integer(16,24);
   for(let i=0;i<reps;i++) liquifyRegion(baseCtx,0,0,W,H,rand(.135,.220));
 }else if(phase==='bg' && bgPool.length){
   const s=choose(bgPool), box=expandRegionAroundStroke(s,.18,.34), reps=integer(6,9);
   for(let i=0;i<reps;i++) liquifyRegion(baseCtx,box.x,box.y,box.w,box.h,rand(.050,.090));
 }else if(phase==='bg_end' && bgPool.length){
   const s=choose(bgPool), box=expandRegionAroundStroke(s,.20,.38), reps=integer(8,11);
   for(let i=0;i<reps;i++) liquifyRegion(baseCtx,box.x,box.y,box.w,box.h,rand(.065,.110));
 }
 compositeBase();
}
function timedLiquify(now){
 while(liquifyIndex<liquifyEvents.length && now>=liquifyEvents[liquifyIndex].time){
   applyLiquifyEvent(liquifyEvents[liquifyIndex].phase);
   liquifyIndex++;
 }
}
function glazeStroke(context,s){
 if(!s||s.kind!=='form'||s.width<34)return;
 const p0=s.pts[0],p1=s.pts[s.pts.length-1];
 const mid=s.pts[(s.pts.length/2)|0]||p0;
 const alt=s.blend?mix(s.color,s.blend,.58):illuminate(s.color,.18);
 const glaze=strokePoints(s.pts,s.width*rand(.78,1.06),alt,{
   alpha:.05,blend:illuminate(alt,.18),edgeSoft:1.35,kind:'glaze',duration:.2,sheen:false,
   in:rand(.08,.18),out:rand(.10,.20),wave:rand(.05,.14),flat:true
 });
 paintRibbon(context,glaze,glaze.pts.length-1);
 if(chance(.72)){
   const shadowTone=deepen(s.blend||s.color,rand(.18,.34));
   const shadow=strokePoints(s.pts,s.width*rand(.72,.98),shadowTone,{alpha:rand(.035,.06),blend:deepen(shadowTone,.10),edgeSoft:1.46,kind:'glaze',duration:.2,sheen:false,in:rand(.10,.20),out:rand(.12,.22),wave:rand(.04,.12),flat:true});
   paintRibbon(context,shadow,shadow.pts.length-1);
 }
 if(chance(.68)){
   const softPath=makePath(mid[0]+rand(-s.width*.18,s.width*.18),mid[1]+rand(-s.width*.18,s.width*.18),rand(s.width*1.2,s.width*3.4),Math.atan2(p1[1]-p0[1],p1[0]-p0[0])+rand(-.55,.55),rand(.04,.12),integer(12,24),'flow');
   const veil=strokePoints(softPath,rand(s.width*.18,s.width*.42),illuminate(alt,.08),{alpha:.05,blend:alt,edgeSoft:1.5,kind:'glaze',duration:.2,sheen:false,flat:true});
   paintRibbon(context,veil,veil.pts.length-1);
 }
}
function compositeBase(){
 ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(baseLayer,0,0);ctx.restore();
}
function paintTo(now){
 // La base guarda los gestos ya terminados. El trazo activo se dibuja entero
 // hasta la posicion actual: sin divisiones, rayas ni cortes entre segmentos.
 let changes=0;
 while(actionIndex<actions.length && now>=actions[actionIndex].to && changes<300){
  const s=actions[actionIndex].stroke;
  paintRibbon(baseCtx,s,s.pts.length-1);
  if(s.kind==='form') liquifyFormStroke(baseCtx,s);
  if(s.kind==='detail' && !s.noAutoLiquify) liquifyEveryDetail(baseCtx,s);
  completed++;
  if(s.kind==='background'){
    bgPool.push(s); if(bgPool.length>36)bgPool.shift();
  }else if(s.kind==='form'){
    formPool.push(s); if(formPool.length>80)formPool.shift();
    liquifyPool.push(s); if(liquifyPool.length>56)liquifyPool.shift();
  }else if(s.kind==='detail'){
    detailPool.push(s); if(detailPool.length>96)detailPool.shift();
  }
  actionIndex++;changes++;
 }
 compositeBase();
 if(actionIndex<actions.length){
  const a=actions[actionIndex];
  if(now>=a.from){
   const t=clamp01((now-a.from)/(a.to-a.from));
   const upto=Math.floor((a.stroke.pts.length-1)*t);
   if(upto>=1)paintRibbon(ctx,a.stroke,upto);
  }
 }
}
// Guardado automático: una sola carpeta seleccionada al abrir esta sesión.
let outputDirectory=null;
let saveQueue=Promise.resolve();
let sessionStarted=false;
const folderStart=document.getElementById('folderStart');
const chooseFolder=document.getElementById('chooseFolder');
const folderError=document.getElementById('folderError');
async function ensureDirectoryPermission(){
 if(!outputDirectory) return false;
 try{
   if(outputDirectory.queryPermission){
     let state=await outputDirectory.queryPermission({mode:'readwrite'});
     if(state==='granted') return true;
     if(outputDirectory.requestPermission){
       state=await outputDirectory.requestPermission({mode:'readwrite'});
       return state==='granted';
     }
     return false;
   }
   return true;
 }catch(e){
   console.error('No se pudo comprobar el permiso de carpeta',e);
   return false;
 }
}

function queueFinishedPaintingSave(){
 if(!outputDirectory)return;
 // Captura primero la pintura acabada; así el reinicio no afecta al archivo.
 const img=document.createElement('canvas');
 const desired=4200;
 const scale=Math.max(1,desired/Math.max(baseLayer.width,baseLayer.height));
 img.width=Math.round(baseLayer.width*scale);
 img.height=Math.round(baseLayer.height*scale);
 const ic=img.getContext('2d',{alpha:false});
 if(!ic)return;
 ic.imageSmoothingEnabled=true;
 ic.imageSmoothingQuality='high';
 ic.drawImage(baseLayer,0,0,img.width,img.height);
 const number=String(workNo).padStart(4,'0');
 const stamp=new Date().toISOString().replace(/[:.]/g,'-');
 const filename=`ECUACION_CREATIVA_INFINITO_${number}_${stamp}.png`;
 saveQueue=saveQueue.then(async()=>{
   const allowed=await ensureDirectoryPermission();
   if(!allowed) throw new Error('Sin permiso de escritura en la carpeta elegida');
   const blob=await new Promise((resolve,reject)=>img.toBlob(b=>b?resolve(b):reject(new Error('No se pudo crear el PNG')),'image/png'));
   const file=await outputDirectory.getFileHandle(filename,{create:true});
   const writer=await file.createWritable();
   try{await writer.write(blob);await writer.close(); folderError.textContent='';}
   catch(e){try{await writer.abort();}catch(_){}throw e;}
 }).catch(e=>{
   console.error('No se pudo guardar automáticamente',filename,e);
   folderError.textContent='No se pudo guardar una imagen. Haz clic en “Elegir carpeta” para restaurar el permiso de guardado.';
   folderStart.hidden=false;
 });
}

chooseFolder.addEventListener('click',async()=>{
 if(typeof window.showDirectoryPicker!=='function'){
   folderError.textContent='Para elegir una carpeta y guardar automáticamente, abre el HTML en Google Chrome o Microsoft Edge para computadora.';
   return;
 }
 // El explorador solo permite mostrar este diálogo después de un clic del usuario.
 try{
   const selected=await window.showDirectoryPicker({id:'ecuacion-creativa-infinito',mode:'readwrite'});
   outputDirectory=selected;
   const allowed=await ensureDirectoryPermission();
   if(!allowed) throw new Error('El navegador no concedió permiso de escritura a la carpeta.');
   folderStart.hidden=true;
   folderError.textContent='';
   if(!sessionStarted){sessionStarted=true;resize();requestAnimationFrame(frame);}
 }catch(e){
   if(e && e.name==='AbortError')return;
   folderError.textContent='No se pudo seleccionar la carpeta. Comprueba el permiso e inténtalo otra vez.';
   console.error(e);
 }
});

function resetWork(now=performance.now()){
  workNo++;
  preparePalette();prepareComposition();
  ctx.setTransform(D,0,0,D,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  baseCtx.setTransform(D,0,0,D,0,0);baseCtx.imageSmoothingEnabled=true;
  backgroundBase();compositeBase();actions=[];actionIndex=0;completed=0;liquifyPool=[];
  bgPool=[];formPool=[];detailPool=[];liquifyEvents=[];liquifyIndex=0;
  startAt=now;finishAt=now+70000;
  holdAt=0;phase='paint';cycleCompleted=false;initialGlobalLiquifyDone=false;
  buildBackground();buildMainForms();buildDetails();organizeActions();prepareLiquifyPlan();
}
function frame(now){
 if(!paused){
  if(phase==='hold'){
    if(now-holdAt>=3000) resetWork(now);
  }else{
    paintTo(now);
    // En cuanto aparece la primera imagen pintada en la base, aplicar un liquify fuerte en todo el lienzo.
    if(!initialGlobalLiquifyDone && completed>0){
      applyLiquifyEvent('global_start');
      initialGlobalLiquifyDone=true;
    }
    timedLiquify(now);
    if(!cycleCompleted && now>=finishAt){
      // Completa el último brochazo y luego aplica un liquify final antes de terminar.
      paintTo(finishAt+4000);
      applyLiquifyEvent('bg_end');
      phase='hold';
      holdAt=now;
      cycleCompleted=true;
      queueFinishedPaintingSave();
    }
  }
 }
 requestAnimationFrame(frame);
}
function resize(){
 const dw=Math.max(1,innerWidth),dh=Math.max(1,innerHeight);
 // Proporciones libres y alta definición; misma presión proporcional en teléfono y pantalla grande.
 W=1200;H=Math.max(540,Math.min(2100,1200*dh/dw));
 const dpx=Math.min(Math.max(devicePixelRatio||1,1),2.2,Math.sqrt(6600000/(dw*dh)));
 D=Math.max(.5,dw/W*dpx);
 canvas.width=Math.max(1,Math.round(dw*dpx));
 canvas.height=Math.max(1,Math.round(dh*dpx));
 ctx.setTransform(D,0,0,D,0,0);
 baseLayer.width=canvas.width;baseLayer.height=canvas.height;
 resetWork(performance.now());
}
window.addEventListener('resize',()=>{clearTimeout(pendingResize);pendingResize=setTimeout(resize,180)},{passive:true});
window.addEventListener('keydown',e=>{
 if(e.key==='n'||e.key==='N'){paused=false;resetWork(performance.now())}
 if(e.key==='p'||e.key==='P'||e.key===' '){paused=!paused;e.preventDefault()}
});
window.addEventListener('dblclick',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{})},{passive:true});
// Exhibición pública: iniciar inmediatamente, sin guardar PNG ni solicitar carpetas.
resize();
requestAnimationFrame(frame);
</script>
