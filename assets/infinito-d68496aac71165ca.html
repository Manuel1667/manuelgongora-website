let landscapeWork=false,landscapeDone=false,dominantLargeWork=false,thinkingPace=1,nextThoughtShift=0,artistPauseUntil=0,artistPauseCount=0,artistPauseTarget=2,pauseMarks=[],topSealKinds=[];let W,H,D=Math.min(devicePixelRatio||1,2),paused=false,phase='paint',phaseAt=0,started=0,nextAction=0,bg='white',zones=[],workNo=0,actionsDone=0,profile=null,strokeQueue=[],nextTempoShift=0,tempo=1,maturity=0,minActions=0,maxActions=0,baseQueued=false,strokesSinceLiquify=0,nextLiquifyAt=14,massAreas=[],finishAt=0,monolithicPlaneWork=false,clawWork=false;

function chooseBg(){bg='white'}
function lightShare(){try{let sw=48,sh=36,t=document.createElement('canvas');t.width=sw;t.height=sh;let x=t.getContext('2d');x.drawImage(c,0,0,sw,sh);let d=x.getImageData(0,0,sw,sh).data,n=sw*sh,light=0;for(let i=0;i<d.length;i+=4){let lum=(d[i]+d[i+1]+d[i+2])/3;if(lum>=225)light++}return light/n}catch(e){return 1}}

function fillBg(){let v=bg==='black'?R(0,10):bg==='gray'?R(225,241):R(252,255);g.fillStyle=`rgb(${v|0},${v|0},${v|0})`;g.fillRect(0,0,W,H)}

// Cada obra recibe una estructura distinta: abierta, densa, planar, mecánica o humano-orgánica.
function chooseProfile(){let kind=pick(['open','dense','planes','mechanical','human','hybrid','monumental']);let P={kind,zones:R(2,6)|0,planes:0,mechanical:0,human:0,density:R(.72,1.4),connectors:R(1,4)|0};if(kind==='open'){P.zones=R(2,4)|0;P.density=R(.55,.85)}if(kind==='dense'){P.zones=R(4,7)|0;P.density=R(1.2,1.65)}if(kind==='planes'){P.planes=R(2,5)|0}if(kind==='mechanical'){P.mechanical=R(3,7)|0;P.planes=R(1,3)|0}if(kind==='human'){P.human=R(6,10)|0}if(kind==='hybrid'){P.mechanical=R(2,5)|0;P.human=R(2,5)|0;P.planes=R(1,3)|0}if(kind==='monumental'){P.planes=R(2,4)|0;P.human=R(1,4)|0;P.mechanical=R(1,4)|0;P.density=R(.8,1.25)}return P}
// Base pictórica: 1–3 gestos negros muy anchos (aprox. 10% del canvas), pintados progresivamente, no colocados de golpe.
function fatBlackGesture(){let S=Math.min(W,H),edge=R(S*.075,S*.13),side=Math.random()<.55, x=side?R(-W*.05,W*.22):R(W*.08,W*.78),y=R(H*.05,H*.88),L=R(W*.38,W*.95),a=R(-.32,.32)+(Math.random()<.22?R(1.15,1.9):0),steps=R(55,115)|0,pts=[[x,y]],px=x,py=y;for(let i=1;i<=steps;i++){let t=i/steps,st=L/steps*R(.75,1.22);a+=R(-.045,.045)+Math.sin(t*Math.PI*R(1,2.5))*R(-.012,.012);px+=Math.cos(a)*st;py+=Math.sin(a)*st;pts.push([px,py])}queueStroke(pts,edge,`rgba(${R(0,18)|0},${R(0,18)|0},${R(0,18)|0},1)`,R(.8,1.8));}
function queueInitialBase(){if(Math.random()<.34)paintedMass();hairCloud();baseQueued=true;}
function broadPlane(){if(!preserveWhite())paintedMass()}
// La masa negra NO aparece como rectángulo: se construye con una brocha muy gruesa, como pintura fresca.
function paintedMass(){if(performance.now()-safeWorkStartedAt>=13000*EXECUTION_SLOW)return;
 let S=Math.min(W,H),cx=R(W*.10,W*.72),cy=R(H*.03,H*.42),passes=R(4,8)|0;
 let span=R(H*.34,H*.82),blackScale=pick([1,1,1,1.35,1.7,2,2.4,3]),bw=Math.min(S*.24,R(S*.045,S*.11)*blackScale),base=R(.72,2.18),pack=[];
 let minx=W,maxx=0,miny=H,maxy=0;
 for(let k=0;k<passes;k++){
  let pts=[],steps=R(44,84)|0,x=cx+R(-bw*.32,bw*.32),y=cy+R(-bw*.22,bw*.22),a=base+R(-.055,.055);
  pts.push([x,y]);
  let formTurn=(Math.random()<.72?(Math.random()<.5?-1:1)*R(.010,.026):0),formPulse=R(1.0,2.4);
  for(let i=1;i<=steps;i++){let t=i/steps,st=span/steps*R(.84,1.16);a+=formTurn*Math.sin(t*Math.PI)+Math.sin(t*Math.PI*formPulse+k*.12)*R(-.016,.016)+R(-.010,.010);x+=Math.cos(a)*st;y+=Math.sin(a)*st;pts.push([x,y]);minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}
  pack.push([pts,bw*R(.82,1.18),`rgba(${R(0,9)|0},${R(0,9)|0},${R(0,9)|0},1)`,R(5.5,9.0)])
 }
 let area={x:clamp(minx-bw,0,W),y:clamp(miny-bw,0,H),w:clamp(maxx-minx+bw*2,100,W),h:clamp(maxy-miny+bw*2,100,H)};massAreas.push(area);if(massAreas.length>8)massAreas.shift();
 for(let k=0;k<pack.length;k++){let q=pack[k];queueStroke(q[0],q[1],q[2],q[3],true,k===pack.length-1?()=>{liquifyRegion(area.x,area.y,area.w,area.h,R(.40,.70));whiteThroughBlack(area);blackClawTips(area);}:null)}
}

// En ~22.5% de las obras: un solo plano negro continuo ocupa aproximadamente 20–40% del lienzo.
function organicTaperedExtension(ax,ay,ang,L,w0,color,liqMin=.08,liqMax=.18){
 // La punta nace DENTRO de la masa y se estira como la misma pintura: nunca se dibuja un triángulo aparte.
 let S=Math.min(W,H),steps=R(15,27)|0,pts=[[ax,ay]],x=ax,y=ay,a=ang,phase=R(0,Math.PI*2);
 for(let i=1;i<=steps;i++){
   let t=i/steps,st=L/steps*R(.86,1.14);
   a+=Math.sin(t*Math.PI*R(1.1,2.3)+phase)*R(-.020,.020)+R(-.020,.020)*(1-t);
   x+=Math.cos(a)*st;y+=Math.sin(a)*st;pts.push([x,y]);
 }
 g.save();g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.strokeStyle=color;g.lineCap='round';g.lineJoin='round';
 for(let i=1;i<pts.length;i++){
   let t=i/(pts.length-1),organic=.88+.12*Math.sin(t*Math.PI*R(1.5,3.2)+phase);
   let w=Math.max(.35,w0*Math.pow(1-t,1.28)*organic);
   g.lineWidth=w;g.beginPath();g.moveTo(pts[i-1][0],pts[i-1][1]);g.lineTo(pts[i][0],pts[i][1]);g.stroke();
 }
 g.restore();
 let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),pad=Math.max(S*.012,w0*.60),x0=clamp(Math.min(...xs)-pad,0,W),y0=clamp(Math.min(...ys)-pad,0,H),rw=clamp(Math.max(...xs)-Math.min(...xs)+pad*2,24,W-x0),rh=clamp(Math.max(...ys)-Math.min(...ys)+pad*2,24,H-y0);
 liquifyRegion(x0,y0,rw,rh,R(liqMin,liqMax));
 return pts;
}
function blackClawTips(m){
 if(!m)return;
 // Las prolongaciones puntiagudas salen de la propia masa negra, no son triángulos ni piezas superpuestas.
 let S=Math.min(W,H),n=R(3,8)|0,cx=m.x+m.w*.5,cy=m.y+m.h*.5;
 for(let i=0;i<n;i++){
   let side=R(0,4)|0,x,y,ang;
   if(side===0){x=R(m.x+m.w*.12,m.x+m.w*.88);y=m.y+R(m.h*.04,m.h*.18);ang=R(-2.05,-1.10)}
   else if(side===1){x=m.x+m.w-R(m.w*.04,m.w*.18);y=R(m.y+m.h*.12,m.y+m.h*.88);ang=R(-.72,.72)}
   else if(side===2){x=R(m.x+m.w*.12,m.x+m.w*.88);y=m.y+m.h-R(m.h*.04,m.h*.18);ang=R(1.10,2.05)}
   else{x=m.x+R(m.w*.04,m.w*.18);y=R(m.y+m.h*.12,m.y+m.h*.88);ang=R(2.42,3.86)}
   // El arranque queda metido en la masa para que la punta sea una extensión continua de ella.
   x+=(cx-x)*R(.05,.16);y+=(cy-y)*R(.05,.16);
   organicTaperedExtension(x,y,ang,R(S*.13,S*.34),R(S*.030,S*.080),`rgb(${R(0,8)|0},${R(0,8)|0},${R(0,8)|0})`,.12,.25);
 }
}

function dominantBlackForm(){if(performance.now()-safeWorkStartedAt>=13000*EXECUTION_SLOW)return;
 let target=R(.50,.70),area=W*H*target,aspect=R(.78,1.35);
 let pw=Math.min(W*.96,Math.sqrt(area*aspect)),ph=Math.min(H*.96,area/Math.max(1,pw));
 if(pw*ph<area*.90){pw=Math.min(W*.98,area/Math.max(1,ph))}
 let cx=R(pw*.48,W-pw*.48),cy=R(ph*.48,H-ph*.48),rot=R(-.22,.22),n=R(18,28)|0,pts=[];
 for(let i=0;i<n;i++){
   let a=Math.PI*2*i/n,rr=R(.86,1.13);
   if(Math.random()<.18)rr*=R(.72,.90);
   let x=Math.cos(a)*pw*.50*rr,y=Math.sin(a)*ph*.50*rr;
   pts.push([cx+Math.cos(rot)*x-Math.sin(rot)*y,cy+Math.sin(rot)*x+Math.cos(rot)*y]);
 }
 g.save();g.fillStyle=`rgba(${R(0,7)|0},${R(0,7)|0},${R(0,7)|0},1)`;
 g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
 for(let i=0;i<n;i++){let p=pts[i],q=pts[(i+1)%n],mx=(p[0]+q[0])*.5,my=(p[1]+q[1])*.5;g.quadraticCurveTo(p[0],p[1],mx,my)}
 g.closePath();g.fill();g.restore();
 let m={x:clamp(cx-pw*.56,0,W),y:clamp(cy-ph*.56,0,H),w:clamp(pw*1.12,100,W),h:clamp(ph*1.12,100,H)};
 massAreas.push(m);liquifyRegion(m.x,m.y,m.w,m.h,R(.025,.070));blackClawTips(m);
 // Pelo conceptual sobre la gran masa: manos/caras/ojos/cruces/clavos/espinas.
 let q=R(2,5)|0;while(q--)(void 0);
}
function monolithicBlackPlane(){if(performance.now()-safeWorkStartedAt>=13000*EXECUTION_SLOW)return;
 let S=Math.min(W,H),target=R(.20,.40),area=W*H*target,aspect=R(.55,1.75),pw=Math.min(W*.82,Math.sqrt(area*aspect)),ph=Math.min(H*.82,area/Math.max(1,pw));
 if(pw*ph<area*.72){ph=Math.min(H*.82,area/Math.max(1,pw))}
 let cx=R(pw*.52,W-pw*.52),cy=R(ph*.52,H-ph*.52),rot=R(-.55,.55),n=12,pts=[];
 for(let i=0;i<n;i++){let a=Math.PI*2*i/n,rr=R(.84,1.12),x=Math.cos(a)*pw*.50*rr,y=Math.sin(a)*ph*.50*rr;let X=cx+Math.cos(rot)*x-Math.sin(rot)*y,Y=cy+Math.sin(rot)*x+Math.cos(rot)*y;pts.push([X,Y])}
 g.save();g.fillStyle=`rgba(${R(0,8)|0},${R(0,8)|0},${R(0,8)|0},1)`;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
 for(let i=0;i<n;i++){let p=pts[i],q=pts[(i+1)%n],mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;g.quadraticCurveTo(p[0],p[1],mx,my)}g.closePath();g.fill();g.restore();
 let m={x:clamp(cx-pw*.62,0,W),y:clamp(cy-ph*.62,0,H),w:clamp(pw*1.24,90,W),h:clamp(ph*1.24,90,H)};massAreas.push(m);liquifyRegion(m.x,m.y,m.w,m.h,R(.05,.15));if(Math.random()<.55)whiteThroughBlack(m);blackClawTips(m);
}
// Formas negras sugeridas: humanas, manos o mecánicas; abstractas, nunca literales ni siempre tipo raíz.
function suggestiveBlackForm(){
 // Masa negra viva: jamás icono, silueta prefabricada, óvalo ni plano gráfico.
 if(preserveWhite())return;
 let z=pick(zones),[cx,cy]=pt(z,.62),S=Math.min(W,H),sc=R(S*.08,S*.22),rot=R(-Math.PI,Math.PI);
 let strands=R(4,9)|0,all=[];
 g.save();g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.lineCap='round';g.lineJoin='round';
 for(let k=0;k<strands;k++){
   let a=rot+R(-1.15,1.15),x=cx+R(-sc*.18,sc*.18),y=cy+R(-sc*.18,sc*.18),L=R(sc*.70,sc*1.65),steps=R(16,32)|0,pts=[[x,y]],phase=R(0,Math.PI*2);
   for(let i=1;i<=steps;i++){let t=i/steps,st=L/steps*R(.75,1.25);a+=Math.sin(t*Math.PI*R(.7,2.1)+phase)*R(-.055,.055)+R(-.045,.045);x+=Math.cos(a)*st;y+=Math.sin(a)*st;pts.push([x,y]);all.push([x,y]);}
   g.strokeStyle=`rgb(${R(0,9)|0},${R(0,9)|0},${R(0,9)|0})`;g.lineWidth=R(sc*.16,sc*.42)*(1-k/(strands*2.2));g.beginPath();g.moveTo(...pts[0]);for(let i=1;i<pts.length-1;i++){let p=pts[i],q=pts[i+1];g.quadraticCurveTo(p[0],p[1],(p[0]+q[0])*.5,(p[1]+q[1])*.5)}g.lineTo(...pts[pts.length-1]);g.stroke();
 }
 g.restore();
 if(!all.length)return;
 let xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),pad=sc*.34,m={x:clamp(Math.min(...xs)-pad,0,W),y:clamp(Math.min(...ys)-pad,0,H),w:0,h:0};m.w=clamp(Math.max(...xs)-Math.min(...xs)+pad*2,60,W-m.x);m.h=clamp(Math.max(...ys)-Math.min(...ys)+pad*2,60,H-m.y);massAreas.push(m);if(massAreas.length>8)massAreas.shift();
 // La distorsión rompe cualquier lectura de vector/símbolo y funde la masa con la pintura.
 liquifyRegion(m.x,m.y,m.w,m.h,R(.16,.32));
 // Pelos nacen de la masa, no se añaden rayas decorativas.
 let hn=R(13,29)|0;for(let h=0;h<hn;h++){let p=all[R(0,all.length)|0],a=R(-Math.PI,Math.PI),L=R(S*.018,S*.075),steps=R(12,25)|0,x=p[0],y=p[1];g.save();g.strokeStyle=`rgba(${R(35,95)|0},${R(35,95)|0},${R(35,95)|0},${R(.55,.90)})`;g.lineWidth=R(.25,1.15);g.lineCap='round';g.beginPath();g.moveTo(x,y);for(let j=1;j<=steps;j++){a+=R(-.06,.06);x+=Math.cos(a)*L/steps;y+=Math.sin(a)*L/steps;g.lineTo(x,y)}g.stroke();g.restore();}
}
function whiteMysticSpearTips(cx,cy,sc,rot,anchors){
 // Las puntas blancas nacen de la MISMA forma blanca. No se añaden triángulos ni figuras independientes.
 let n=Math.random()<.03?3:pick([1,2,4,5]),all=[];anchors=(anchors&&anchors.length)?anchors:[[cx,cy]];
 for(let i=0;i<n;i++){
   let p=anchors[R(0,anchors.length)|0],dx=p[0]-cx,dy=p[1]-cy;
   let outward=Math.atan2(dy,dx);if(!isFinite(outward)||Math.hypot(dx,dy)<sc*.12)outward=rot+R(-Math.PI,Math.PI);
   let ang=outward+R(-.42,.42);
   // Empieza un poco hacia dentro para fundirse con el grosor blanco ya existente.
   let ax=p[0]-Math.cos(ang)*sc*R(.05,.16),ay=p[1]-Math.sin(ang)*sc*R(.05,.16);
   let pts=organicTaperedExtension(ax,ay,ang,R(sc*.45,sc*1.12),R(sc*.16,sc*.32),'rgb(255,255,255)',.07,.15);all.push(...pts);
 }
 return all;
}

function twistedWhiteHumanoid(cx,cy,sc,rot,color='rgb(255,255,255)',mirror=1){
 // Nunca aparece ningún humanoide después de 15 segundos desde el comienzo de la obra.
 if(typeof safeWorkStartedAt!=='undefined'&&finishAt>safeWorkStartedAt&&performance.now()-safeWorkStartedAt>=(finishAt-safeWorkStartedAt)*.75)return;
 // Humanoide inspirado en el gesto del artista: masa orgánica continua, nunca copy/paste, nunca feather.
 // Brazos elevados/retorcidos, torso comprimido y piernas quebradas; cambia proporción, giro, espejo y tensión en cada aparición.
 const T=(x,y)=>{x*=mirror;return [cx+(Math.cos(rot)*x-Math.sin(rot)*y)*sc,cy+(Math.sin(rot)*x+Math.cos(rot)*y)*sc]};
 let lean=R(-.20,.20),tw=R(-.20,.20),armL=R(.86,1.18),armR=R(.86,1.20),leg=R(.88,1.18);
 let body=[[-.18+lean,-.70],[-.34+tw,-.50],[-.30,-.20],[-.52,.06],[-.34,.28],[-.18,.18],[-.10,.48],[-.30,.82*leg],[-.12,.96*leg],[.06,.70*leg],[.18,.42],[.34,.68*leg],[.54,.80*leg],[.44,.58*leg],[.26,.24],[.38,-.02],[.28,-.28],[.18,-.52],[.02+lean,-.72]];
 let leftArm=[[-.25,-.48],[-.50,-.62],[-.62,-.88*armL],[-.55,-1.10*armL],[-.42,-.96*armL],[-.38,-.74]];
 let rightArm=[[.10,-.54],[.34,-.70],[.42,-.98*armR],[.36,-1.18*armR],[.50,-1.08*armR],[.54,-.84]];
 let head=[[-.17+lean,-.80],[-.11+lean,-.98],[.04+lean,-1.06],[.18+lean,-.96],[.17+lean,-.78],[.04+lean,-.69]];
 // Cuello visible y continuo: la cabeza nunca queda cortada o flotando.
 let neck=[[-.13+lean,-.78],[-.12+lean,-.66],[.08+lean,-.64],[.12+lean,-.79]];
 // Palmas orgánicas unidas a los brazos; los dedos nacen de estas manos.
 let leftHand=[[-.61,-1.08*armL],[-.68,-1.13*armL],[-.61,-1.20*armL],[-.52,-1.15*armL],[-.49,-1.05*armL]];
 let rightHand=[[.34,-1.15*armR],[.39,-1.23*armR],[.49,-1.20*armR],[.54,-1.11*armR],[.46,-1.04*armR]];
 let shapes=[body,neck,head,leftArm,rightArm,leftHand,rightHand],all=[];
 g.save();g.globalAlpha=1;g.globalCompositeOperation='source-over';g.filter='none';g.fillStyle=color;
